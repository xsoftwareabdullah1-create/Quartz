services:
  - type: web
    name: quartz-auth-service
    runtime: node
    plan: free
    region: singapore
    rootDir: auth
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quartz-auth-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: QUARTZ_PUBLIC_URL
        fromService:
          name: quartz-auth-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: QUARTZ_WEB_URL
        value: https://xsoftwareabdullah1-create.github.io
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: quartz-auth-db
    plan: free
    databaseName: quartz
    user: quartz
    postgresMajorVersion: "16"
