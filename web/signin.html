<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Sign in to your Quartz account.">
<title>Sign in — Quartz</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="signin.css">
</head>
<body>
<header class="signin-header"><a class="back-link" href="./" aria-label="Back to Quartz search">← <span>Quartz</span></a><span class="header-note">Account sign-in</span></header>
<main class="signin-main">
<section class="signin-card" aria-labelledby="signin-title">
<a class="brand-mark" href="./" aria-label="Quartz home"><span class="brand-q">Q</span></a>
<h1 id="signin-title">Sign in</h1>
<p class="subtitle">Use your Quartz account</p>
<div id="signin-status" class="status" role="status" aria-live="polite">Checking sign-in options…</div>
<a id="google-button" class="google-button" href="#" hidden>
<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.05 13.22l7.98 6.19C11.97 13.72 17.48 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.96 46.98 31.82 46.98 24.55z"/><path fill="#FBBC05" d="M10.03 28.59A14.4 14.4 0 0 1 9.25 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.57 10.78l7.46-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.14 1.44-4.89 2.3-8.18 2.3-6.52 0-12.03-4.22-13.97-9.91l-7.98 6.19C6.51 43.62 14.62 48 24 48z"/></svg>
<span>Continue with Google</span>
</a>
<div class="separator"><span>or</span></div>
<form id="email-form">
<label for="email-address">Email</label>
<input id="email-address" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="you@example.com" required>
<button id="send-code" class="primary-button" type="submit">Continue with email</button>
</form>
<form id="verify-form" hidden>
<label for="email-code">6-digit verification code</label>
<input id="email-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="Enter code" required>
<p class="helper">Check your inbox. The code expires in 10 minutes.</p>
<button id="verify-code" class="primary-button" type="submit">Verify and sign in</button>
<button id="change-email" class="text-button" type="button">Use a different email</button>
</form>
<p id="message" class="message" role="status" aria-live="polite"></p>
<p class="fine-print">By continuing, you sign in to Quartz. Your searches work without an account.</p>
</section>
</main>
<footer><a href="./">Back to search</a><span>Secure sign-in · Quartz</span></footer>
<script src="config.js"></script>
<script src="signin.js"></script>
</body>
</html>
